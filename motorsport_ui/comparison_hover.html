<!doctype html><html lang="it"><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#0e1117;color:#f5f7fc;font:14px system-ui,sans-serif}
.comparison{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:10px;width:100%;height:100vh}
#telemetry{min-width:0;width:100%;height:100%}
.readout-column{position:relative;min-width:0}
#readout{position:absolute;top:100px;left:0;right:5px;padding:12px;border:1px solid #40516a;border-radius:8px;background:#192230;overflow-wrap:anywhere}
#readout h3{font-size:14px;margin:0 0 10px}#readout p{font-size:12px;color:#b8c9dd;margin:7px 0}
.reading{margin:12px 0;padding-left:8px;border-left:4px solid}.value{font:600 20px monospace;margin-top:4px}.identity{font-size:12px;line-height:1.5}
@media(max-width:650px){.comparison{grid-template-columns:minmax(0,1fr) 160px;gap:3px}#readout{padding:7px}.value{font-size:15px}}
</style></head><body><div class="comparison"><div id="telemetry"></div>
<aside class="readout-column"><section id="readout" aria-live="polite"><h3>Lettura telemetria</h3>
<p>Passa sui segnali: valori e giro/finestra compaiono qui, fuori dall’area dati.</p></section></aside></div>
<script>/*PLOTLY_BUNDLE*/</script><script id="comparison-data" type="application/json">/*FIGURE_JSON*/</script>
<script>
const spec=JSON.parse(document.getElementById('comparison-data').textContent);
const chart=document.getElementById('telemetry'),readout=document.getElementById('readout');
Plotly.newPlot(chart,spec.data,spec.layout,{responsive:true,displaylogo:false}).then(()=>{
  chart.on('plotly_hover',event=>{
    if(!event.points?.length)return;
    const points=event.points.filter(p=>p.data.meta?.channel);
    if(!points.length)return;
    readout.replaceChildren();
    const title=document.createElement('h3');title.textContent=points[0].data.meta.channel;readout.append(title);
    const note=document.createElement('p');note.textContent='Ultimo punto ispezionato · tempi relativi misurati';readout.append(note);
    for(const point of points){
      const row=document.createElement('div');row.className='reading';row.style.borderColor=point.data.line.color;
      const name=document.createElement('div');name.className='identity';name.textContent=point.data.name;
      const value=document.createElement('div');value.className='value';
      const numeric=Number.isFinite(point.y)?point.y.toLocaleString('it-IT',{maximumFractionDigits:3}):'N/D';
      value.textContent=numeric+' '+point.data.meta.unit;
      const time=document.createElement('p');time.textContent='t = '+Number(point.x).toFixed(3)+' s';
      row.append(name,value,time);readout.append(row);
    }
    // Follow the inspected subplot vertically, always in the reserved side panel.
    // This changes no figure data and cannot cover any plotted signal.
    const desired=points[0].yaxis._offset+10;
    readout.style.top=Math.max(5,Math.min(desired,chart.clientHeight-readout.offsetHeight-8))+'px';
    readout.dataset.hoveredChannel=points[0].data.meta.channel;
  });
});
new ResizeObserver(()=>Plotly.Plots.resize(chart)).observe(chart);
</script></body></html>
